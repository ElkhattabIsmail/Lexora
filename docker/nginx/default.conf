server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Laravel public directory.
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # Allow document uploads (max 20 MB in the FormRequest).
    client_max_body_size 25M;

    location / {
        # Pretty URLs without /index.php.
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Prevent access to hidden files (.env, .git, ...).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        # "app" is the docker-compose service name running PHP-FPM.
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Long-lived cache headers for hashed build assets.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}